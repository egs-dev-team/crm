name: egs
description: Productivity Platform

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '3.22.1'

dependencies:
  animated_toggle_switch: ^0.8.2
  file_picker: ^8.0.3
  flutter:
    sdk: flutter
  flutter_multi_formatter: ^2.12.4
  flutter_svg: ^2.0.8
  google_fonts: ^6.1.0
  intl: ^0.20.1
  path: ^1.9.0
  responsive_framework: ^1.4.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.4
  universal_html: ^2.2.4
  uuid: ^4.4.0
  flutter_riverpod: ^2.5.1
  freezed_annotation: ^2.4.3
  json_serializable: ^6.8.0
  flex_color_scheme: ^8.0.2
  http: ^1.2.2
  flutter_launcher_icons: ^0.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^2.5.2
  build_runner: ^2.4.11


flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: "egs_logo"
  ios: true
  image_path: "assets/images/main.png"
  remove_alpha_ios: true
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/main.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/main.png"
    icon_size: 48 
  macos:
    generate: true
    image_path: "assets/images/main.png"